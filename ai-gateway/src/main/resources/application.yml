server:
  port: ${AI_GATEWAY_PORT:8088}

spring:
  application:
    name: huanbao-ai-gateway
  mvc:
    async:
      # Data-query is a real workflow, not a single SQL round trip. Keep the
      # HTTP streaming response alive long enough for Dify to finish, while
      # still allowing the caller to receive a deterministic error event.
      request-timeout: ${AI_GATEWAY_ASYNC_REQUEST_TIMEOUT_MS:300000}
  datasource:
    url: ${AI_GATEWAY_DB_URL:jdbc:postgresql://localhost:5432/huanbao_ai}
    username: ${AI_GATEWAY_DB_USERNAME:postgres}
    password: ${AI_GATEWAY_DB_PASSWORD:postgres}
    driver-class-name: ${AI_GATEWAY_DB_DRIVER:org.postgresql.Driver}

app:
  version: ${AI_GATEWAY_VERSION:0.1.0}
  cors:
    allowed-origins: ${AI_GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

dify:
  http:
    api-key: ${DIFY_HTTP_API_KEY:}
  policy:
    api-base: ${DIFY_POLICY_API_BASE:http://localhost/v1}
    api-key: ${DIFY_POLICY_API_KEY:}
    timeout-ms: ${DIFY_POLICY_TIMEOUT_MS:30000}
  office:
    api-base: ${DIFY_OFFICE_API_BASE:http://localhost/v1}
    api-key: ${DIFY_OFFICE_API_KEY:}
    timeout-ms: ${DIFY_OFFICE_TIMEOUT_MS:60000}

data-query:
  admin-token: ${DATA_QUERY_ADMIN_TOKEN:}
  api-base: ${DIFY_DATA_QUERY_API_BASE:http://localhost/v1}
  api-key: ${DIFY_DATA_QUERY_API_KEY:}
  # The Dify workflow can spend more than a minute in planning, SQL and
  # presentation nodes before it emits workflow_finished. The upstream read
  # timeout must not race that normal execution window.
  timeout-ms: ${DIFY_DATA_QUERY_TIMEOUT_MS:240000}
  dify-user-hmac-secret: ${DIFY_USER_HMAC_SECRET:}
  identity-mode: ${DATA_QUERY_IDENTITY_MODE:SIGNED_HEADER}
  identity-secret: ${DATA_QUERY_IDENTITY_SECRET:}
  identity-clock-skew-seconds: ${DATA_QUERY_IDENTITY_CLOCK_SKEW_SECONDS:300}
  allow-body-identity-trial: ${DATA_QUERY_ALLOW_BODY_IDENTITY_TRIAL:false}
  max-requests-per-minute: ${DATA_QUERY_MAX_REQUESTS_PER_MINUTE:30}
  max-concurrent-per-user: ${DATA_QUERY_MAX_CONCURRENT_PER_USER:1}
  default-organization-scope: ${DATA_QUERY_DEFAULT_ORGANIZATION_SCOPE:USER_AUTHORIZED}
  allow-group-ranking: ${DATA_QUERY_ALLOW_GROUP_RANKING:false}
  allowed-indicator-codes: ${DATA_QUERY_ALLOWED_INDICATOR_CODES:}
  audit-enabled: ${DATA_QUERY_AUDIT_ENABLED:true}

logging:
  level:
    com.huanbao.aigateway: INFO
