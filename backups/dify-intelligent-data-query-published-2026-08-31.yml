          \ndef _clean_row(row):\n    if not isinstance(row, dict):\n        return\
          \ row\n    return {str(k): v for k, v in row.items() if v is not None and\
          \ v != \"\"}\n\ndef _compact(data):\n    rows = []\n    status = \"success\"\
          \n    if isinstance(data, dict):\n        if isinstance(data.get(\"result\"\
          ), list):\n            rows = data[\"result\"]\n        else:\n        \
          \    return {str(k): v for k, v in data.items() if k not in (\"sql\", \"\
          query\") and v is not None}\n    elif isinstance(data, list):\n        for\
          \ item in data:\n            if isinstance(item, dict):\n              \
          \  if item.get(\"status\"):\n                    status = str(item.get(\"\
          status\"))\n                if isinstance(item.get(\"result\"), list):\n\
          \                    rows.extend(item[\"result\"])\n                elif\
          \ item.get(\"result\") is not None:\n                    rows.append(item.get(\"\
          result\"))\n            else:\n                rows.append(item)\n    else:\n\
          \        return data\n    rows = [_clean_row(row) for row in rows]\n   \
          \ total = len(rows)\n    truncated = total > 500\n    if truncated:\n  \
          \      rows = rows[:250] + rows[-250:]\n    return {\"status\": status,\
          \ \"row_count\": total, \"truncated\": truncated, \"rows\": rows}\n\ndef\
          \ main(args: list) -> dict:\n    if not isinstance(args, list) or not args:\n\
          \        return {\"result\": \"没有查询到结果。\"}\n    parts = []\n    for idx,\
          \ item in enumerate(args, 1):\n        if not isinstance(item, dict):\n\
          \            continue\n        title = str(item.get(\"title\") or \"\")\n\
          \        if item.get(\"ok\") is False:\n            parts.append(\"第 \"\
          \ + str(idx) + \" 条查询失败（\" + title + \"）：\" + str(item.get(\"error\") or\
          \ \"未知错误\"))\n            continue\n        payload = _compact(item.get(\"\
          data\"))\n        parts.append(\"第 \" + str(idx) + \" 条查询（\" + title + \"\
          ）：\" + json.dumps(payload, ensure_ascii=False, separators=(\",\", \":\"\
          )))\n    return {\"result\": \"\\n\".join(parts) if parts else \"没有查询到结果。\"\
          }"
