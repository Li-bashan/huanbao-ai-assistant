    - data:
        code: "# =====================================================================\n\
          # 节点：计算引擎\n# 作用：对计算指标按规则公式统一计算。输入为源指标查询结果+设备参数+规则表，\n#       展开子公式、替换参数、安全求值，输出计算值供回答模型展示。\n\
          # 维护：公式维护在 indicator_formula 表；参数映射见 PARAM_MAP。\n# =====================================================================\n\
          import ast\nimport operator\nimport re\nimport calendar\n\nALIAS = {\n \
          \   \"总发电量\": [\"全厂发电量\"],\n    \"上网电量\": [\"全厂上网电量\"],\n    \"下网电量\": [\"\
          全厂下网电量\"],\n    \"锅炉总运行时间\": [\"锅炉总运行小时数\"],\n    \"锅炉总停运时间\": [\"锅炉总停运小时数\"\
          ],\n    \"汽机总运行时间\": [\"汽机总运行小时数\"],\n    \"汽机总停运时间\": [\"汽机总停运小时数\"],\n\
          }\n\nPARAM_MAP = {\n    \"焚烧炉台数\": \"incinerator_count\",\n    \"汽轮机台数\"\
          : \"installed_units\",\n    \"汽轮机装机\": \"installed_capacity\",\n    \"处理规模\"\
          : \"processing_scale\",\n    \"折标系数\": \"standard_coeff\",\n    \"设计总蒸发量\"\
          : \"total_evaporation\",\n    \"设计总进汽量\": \"total_air_volume\",\n}\n\nOPS\
          \ = {\n    ast.Add: operator.add, ast.Sub: operator.sub,\n    ast.Mult:\
          \ operator.mul, ast.Div: operator.truediv,\n    ast.Pow: operator.pow, ast.USub:\
          \ operator.neg, ast.UAdd: operator.pos,\n}\n\n\ndef safe_eval(node):\n \
          \   if isinstance(node, ast.Expression):\n        return safe_eval(node.body)\n\
          \    if isinstance(node, ast.Constant) and isinstance(node.value, (int,\
          \ float)):\n        return node.value\n    if isinstance(node, ast.BinOp)\
          \ and type(node.op) in OPS:\n        return OPS[type(node.op)](safe_eval(node.left),\
          \ safe_eval(node.right))\n    if isinstance(node, ast.UnaryOp) and type(node.op)\
          \ in OPS:\n        return OPS[type(node.op)](safe_eval(node.operand))\n\
          \    raise ValueError(\"不支持的表达式\")\n\n\ndef parse_rules(text):\n    rules\
          \ = {}\n    for line in str(text or \"\").splitlines():\n        m = re.match(r\"\
          指标：(.+?)｜公式：(.+?)(?:｜参数：(.+))?$\", line.strip())\n        if m:\n      \
          \      rules[m.group(1).strip()] = m.group(2).strip()\n    return rules\n\
          \n\ndef resolve(expr, rules, sources, depth=0):\n    if depth > 10:\n  \
          \      return expr\n    for name, f in rules.items():\n        if name in\
          \ sources:\n            continue\n        if name in expr:\n           \
          \ return resolve(expr.replace(name, \"(\" + f + \")\"), rules, sources,\
          \ depth + 1)\n    return expr\n\n\ndef main(items: list, rules_text: str,\
          \ query: str) -> dict:\n    items = items if isinstance(items, list) else\
          \ []\n    rules = parse_rules(rules_text or \"\")\n    target = \"\"\n \
          \   period = \"\"\n    sources = {}\n    params = {}\n    for it in items:\n\
          \        if not isinstance(it, dict):\n            continue\n        title\
          \ = str(it.get(\"title\") or \"\")\n        data = it.get(\"data\")\n  \
          \      rows = []\n        if isinstance(data, list) and data and isinstance(data[0],\
          \ dict):\n            r0 = data[0].get(\"result\")\n            if isinstance(r0,\
          \ list):\n                rows = r0\n        if title.startswith(\"计算目标\"\
          ):\n            if rows and isinstance(rows[0], dict):\n               \
          \ target = str(rows[0].get(\"calc_target\") or \"\").strip()\n         \
          \       period = str(rows[0].get(\"calc_period\") or \"\").strip()\n   \
          \     elif title == \"设备参数\":\n            if rows and isinstance(rows[0],\
          \ dict):\n                params = rows[0]\n        elif title.startswith(\"\
          源指标\"):\n            name = title.split(\"：\", 1)[-1].strip()\n        \
          \    if rows:\n                for r in rows:\n                    if isinstance(r,\
          \ dict):\n                        for k in (\"v\", \"value\"):\n       \
          \                     if k in r and r[k] is not None:\n                \
          \                try:\n                                    sources[name]\
          \ = float(r[k])\n                                except Exception:\n   \
          \                                 pass\n                               \
          \ break\n                        break\n    if not target or not rules.get(target):\n\
          \        return {\"items\": items, \"has_calc\": \"0\", \"calc_target\"\
          : \"\", \"calc_value\": \"\", \"calc_formula\": \"\", \"calc_params\": \"\
          \", \"calc_detail\": \"\"}\n\n    expr = rules[target]\n    expr = resolve(expr,\
          \ rules, sources)\n    expr = expr.replace(\"×\", \"*\").replace(\"÷\",\
          \ \"/\").replace(\"（\", \"(\").replace(\"）\", \")\")\n\n    param_notes\
          \ = []\n    for cn, key in PARAM_MAP.items():\n        if cn in expr:\n\
          \            val = params.get(key)\n            if val is None:\n      \
          \          return {\"items\": items, \"has_calc\": \"1\", \"calc_target\"\
          : target, \"calc_value\": \"\", \"calc_formula\": rules[target], \"calc_params\"\
          : \"\", \"calc_detail\": \"计算引擎：缺少设备参数 \" + cn}\n            expr = expr.replace(cn,\
          \ \"(\" + str(float(val)) + \")\")\n            param_notes.append(cn +\
          \ \"=\" + str(float(val)))\n\n    if \"月内天数\" in expr:\n        try:\n \
          \           y, m = period.split(\"-\")[:2]\n            days = calendar.monthrange(int(y),\
          \ int(m))[1]\n        except Exception:\n            days = 30\n       \
          \ expr = expr.replace(\"月内天数\", \"(\" + str(days) + \")\")\n        param_notes.append(\"\
          月内天数=\" + str(days))\n\n    for name, val in list(sources.items()):\n  \
          \      expr = expr.replace(name, \"(\" + str(val) + \")\")\n    for operand\
          \ in [n for n in re.findall(r\"[\\u4e00-\\u9fa5A-Za-z#]+\", expr)]:\n  \
          \      for alias in ALIAS.get(operand, []):\n            if alias in sources:\n\
          \                expr = expr.replace(operand, \"(\" + str(sources[alias])\
          \ + \")\")\n                break\n\n    left = re.findall(r\"[\\u4e00-\\\
          u9fa5A-Za-z#]+\", expr)\n    if left:\n        uniq = list(dict.fromkeys(left))\n\
          \        return {\"items\": items, \"has_calc\": \"1\", \"calc_target\"\
          : target, \"calc_value\": \"\", \"calc_formula\": rules[target], \"calc_params\"\
          : \"；\".join(param_notes), \"calc_detail\": \"计算引擎：缺少源指标数据：\" + \"、\".join(uniq)}\n\
          \n    try:\n        tree = ast.parse(expr, mode=\"eval\")\n        value\
          \ = safe_eval(tree.body)\n    except Exception as e:\n        return {\"\
          items\": items, \"has_calc\": \"1\", \"calc_target\": target, \"calc_value\"\
          : \"\", \"calc_formula\": rules[target], \"calc_params\": \"；\".join(param_notes),\
          \ \"calc_detail\": \"计算引擎计算失败：\" + str(e)}\n\n    detail = \"计算公式：\" + rules[target]\
          \ + \"；参数：\" + (\"；\".join(param_notes) if param_notes else \"无\") + \"\
          ；计算结果：\" + str(round(value, 4))\n    return {\n        \"items\": items,\n\
          \        \"has_calc\": \"1\",\n        \"calc_target\": target,\n      \
          \  \"calc_value\": str(round(value, 4)),\n        \"calc_formula\": rules[target],\n\
          \        \"calc_params\": \"；\".join(param_notes),\n        \"calc_detail\"\
          : detail\n    }"
        code_language: python3
        outputs:
          calc_detail:
            children: null
            type: string
          calc_formula:
            children: null
            type: string
          calc_params:
            children: null
            type: string
          calc_target:
            children: null
            type: string
          calc_value:
            children: null
            type: string
          has_calc:
            children: null
            type: string
          items:
            children: null
            type: array[object]
        selected: false
        title: 计算引擎
        type: code
        variables:
        - value_selector:
          - '1781000000012'
          - items
          value_type: array[object]
          variable: items
        - value_selector:
          - '1781000000016'
          - result
          value_type: string
          variable: rules_text
        - value_selector:
          - sys
          - query
          value_type: string
          variable: query
