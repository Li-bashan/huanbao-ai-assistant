    - data:
        code: "# 节点：整理指标字典\n# 输入可以是知识检索 result，也兼容旧数据库工具的 result 包装。\n# 只保留检索命中的有效指标，去重并限制候选数量，避免把整张字典送进模型。\n\
          def _records(value):\n    if isinstance(value, dict):\n        value = value.get(\"\
          result\") or value.get(\"data\") or []\n    if not isinstance(value, list):\n\
          \        return []\n    records = []\n    for item in value:\n        if\
          \ isinstance(item, dict) and isinstance(item.get(\"result\"), list):\n \
          \           records.extend(item[\"result\"])\n        elif isinstance(item,\
          \ (dict, str)):\n            records.append(item)\n    return records\n\n\
          def _content(item):\n    if isinstance(item, dict):\n        return str(item.get(\"\
          content\") or item.get(\"text\") or item.get(\"page_content\") or \"\")\n\
          \    return str(item or \"\")\n\ndef main(args: list) -> dict:\n    rows\
          \ = []\n    seen = set()\n    for item in _records(args):\n        for raw\
          \ in _content(item).splitlines():\n            parts = [part.strip() for\
          \ part in raw.split(\"\\t\")]\n            if len(parts) < 2 or not parts[0]:\n\
          \                continue\n            if parts[0] in (\"指标名称\", \"来源：CGXTAPPMISNewIndicator\"\
          ) or raw.startswith(\"禁止\"):\n                continue\n            if parts[0].isdigit():\n\
          \                code, name = parts[0], parts[1]\n                unit =\
          \ parts[2] if len(parts) > 2 else \"\"\n            else:\n            \
          \    name, code = parts[0], parts[1]\n                unit = parts[2] if\
          \ len(parts) > 2 else \"\"\n            if not name or name in seen:\n \
          \               continue\n            seen.add(name)\n            rows.append(code\
          \ + \"\\t\" + name + (\"\\t\" + unit if unit else \"\"))\n            if\
          \ len(rows) >= 20:\n                break\n        if len(rows) >= 20:\n\
          \            break\n    return {\"result\": \"\\n\".join(rows), \"count\"\
          : len(rows)}"
        code_language: python3
        outputs:
          count:
            children: null
            type: number
