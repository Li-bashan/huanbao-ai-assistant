    - data:
        code: "# 节点：整理指标规则\n# 只保留知识检索命中的规则和截止日期，去重后注入 SQL/回答模型。\ndef _records(value):\n\
          \    if isinstance(value, dict):\n        value = value.get(\"result\")\
          \ or value.get(\"data\") or []\n    if not isinstance(value, list):\n  \
          \      return []\n    records = []\n    for item in value:\n        if isinstance(item,\
          \ dict) and isinstance(item.get(\"result\"), list):\n            records.extend(item[\"\
          result\"])\n        elif isinstance(item, (dict, str)):\n            records.append(item)\n\
          \    return records\n\ndef _content(item):\n    if isinstance(item, dict):\n\
          \        return str(item.get(\"content\") or item.get(\"text\") or item.get(\"\
          page_content\") or \"\")\n    return str(item or \"\")\n\ndef main(args:\
          \ list) -> dict:\n    lines = []\n    seen = set()\n    cutoff = \"\"\n\
          \    for item in _records(args):\n        for raw in _content(item).splitlines():\n\
          \            parts = [part.strip() for part in raw.split(\"\\t\")]\n   \
          \         if len(parts) < 2 or not parts[0]:\n                continue\n\
          \            if parts[0] == \"指标名称\" or parts[0].startswith(\"来源\") or parts[0].startswith(\"\
          规则类型\"):\n                continue\n            name, kind = parts[0], parts[1]\n\
          \            if kind == \"C\":\n                cutoff = parts[2] if len(parts)\
          \ > 2 else \"\"\n                continue\n            if len(parts) < 3\
          \ or not parts[2] or name in seen:\n                continue\n         \
          \   seen.add(name)\n            params = parts[3] if len(parts) > 3 else\
          \ \"\"\n            unit = parts[4] if len(parts) > 4 else \"\"\n      \
          \      line = \"指标：\" + name + \"｜公式：\" + parts[2]\n            if params:\n\
          \                line += \"｜参数：\" + params\n            if unit:\n     \
          \           line += \"｜单位：\" + unit\n            lines.append(line)\n  \
          \          if len(lines) >= 10:\n                break\n        if len(lines)\
          \ >= 10:\n            break\n    return {\"result\": \"\\n\".join(lines),\
          \ \"count\": len(lines), \"cutoff\": cutoff}"
        code_language: python3
