        code: "# =====================================================================\n\
          # 节点：整理查询结果（迭代1内部）\n# 作用：把单条SQL的执行结果统一包装成 {ok, title, sql, error, data}。\n\
          #       正常分支接工具成功输出，失败分支接 error_message。\n# 输入：data = 工具 json；err = 工具 error_message；title/sql\
          \ = 组装SQL参数\n# 注意：金仓 Oracle 兼容模式下空字符串等价于 NULL，err 判断用 str(err or \"\")。\n\
          # =====================================================================\n\
          def main(data: dict, err: str, title: str, sql: str) -> dict:\n    err_text\
