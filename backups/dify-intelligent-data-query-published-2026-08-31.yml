          \ list) else []\n    repaired = repaired if isinstance(repaired, list) else\
          \ []\n    merged = []\n    for item in first:\n        if isinstance(item,\
          \ dict) and item.get(\"ok\") is False:\n            title = str(item.get(\"\
          title\") or \"\")\n            found = None\n            for r in repaired:\n\
          \                if isinstance(r, dict) and str(r.get(\"title\") or \"\"\
          ) == title:\n                    found = r\n                    break\n\
          \            merged.append(found if found is not None else item)\n     \
          \   else:\n            merged.append(item)\n    ok_count = sum(1 for x in\
          \ merged if isinstance(x, dict) and x.get(\"ok\"))\n    fail_count = sum(1\
          \ for x in merged if isinstance(x, dict) and not x.get(\"ok\"))\n    notes\
          \ = []\n    for x in merged:\n        if isinstance(x, dict) and not x.get(\"\
          ok\"):\n            notes.append(str(x.get(\"title\") or \"\") + \"：\" +\
          \ str(x.get(\"error\") or \"\"))\n    return {\n        \"result\": merged,\n\
          \        \"ok_count\": ok_count,\n        \"fail_count\": fail_count,\n\
          \        \"failed_notes\": \"\\n\".join(notes)\n    }"
