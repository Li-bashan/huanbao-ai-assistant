    - data:
        code: "# 节点：解析修复SQL（安全校验层）\n# 解析修复模型返回的 JSON 数组或 {\"queries\": [...]}，并复用\
          \ SQL 白名单。\nimport re\nimport json\n\nALLOWED_TABLE_RE = re.compile(r'^CGXTAPPMISDate_\\\
          d{4}_\\d{2}$')\nALLOWED_TABLES = ('CGXTAPPMISNewIndicator', 'BFAdminOrganization',\
          \ 'enterprise_equipment_info')\nDANGEROUS = ['insert ', 'update ', 'delete\
          \ ', 'drop ', 'truncate ', 'alter ', 'create ', 'grant ', 'revoke ', 'copy\
          \ ']\n\ndef validate_sql(sql):\n    s = str(sql).strip()\n    if not s.lower().startswith(('select',\
          \ 'with')):\n        raise ValueError('SQL 不是 SELECT/WITH 查询，已拦截')\n   \
          \ lower = s.lower()\n    for kw in DANGEROUS:\n        if kw in lower:\n\
          \            raise ValueError('SQL 包含危险关键字：' + kw.strip())\n    body = s.rstrip().rstrip(';')\n\
          \    if ';' in body:\n        raise ValueError('检测到多语句 SQL，已拦截')\n    for\
          \ m in re.finditer(\n        r'(?:from|join)\\s+'\n        r'(?:(?:\"?([A-Za-z0-9_]+)\"\
          ?)\\s*\\.\\s*)?'\n        r'\"?([A-Za-z_][A-Za-z0-9_]*)',\n        s,\n\
          \        re.IGNORECASE,\n    ):\n        schema_name = m.group(1)\n    \
          \    table_name = m.group(2)\n        if schema_name and schema_name.upper()\
          \ != 'MSOKFPT':\n            raise ValueError('引用了非白名单 schema：' + schema_name)\n\
          \        if table_name in ALLOWED_TABLES or ALLOWED_TABLE_RE.match(table_name):\n\
          \            continue\n        raise ValueError('引用了白名单外的表：' + table_name)\n\
          \    if not re.search(r'\\blimit\\s+\\d+', s, re.IGNORECASE):\n        s\
          \ = body + ' LIMIT 1000'\n    return s\n\ndef main(input_string: str) ->\
          \ dict:\n    if not input_string or not input_string.strip():\n        return\
          \ {'result': [], 'count': 0}\n    text = re.sub(r'<think>[\\s\\S]*?</think>',\
          \ '', input_string, flags=re.IGNORECASE).strip()\n    fence = chr(96) *\
          \ 3\n    text = text.replace(fence + 'json', '').replace(fence, '').strip()\n\
          \    candidates = [text]\n    parsed = None\n    for candidate in candidates:\n\
          \        try:\n            value = json.loads(candidate.strip())\n     \
          \   except Exception:\n            continue\n        if isinstance(value,\
          \ dict) and isinstance(value.get('queries'), list):\n            parsed\
          \ = value['queries']\n            break\n        if isinstance(value, list):\n\
          \            parsed = value\n            break\n    if parsed is None:\n\
          \        return {'result': [], 'count': 0}\n    result = []\n    for item\
          \ in parsed:\n        if not isinstance(item, dict):\n            continue\n\
          \        title = str(item.get('title') or item.get('purpose') or '').strip()\n\
          \        sql = str(item.get('sql') or '').strip()\n        if not title\
          \ or not sql:\n            continue\n        try:\n            sql = validate_sql(sql)\n\
          \        except Exception:\n            continue\n        result.append({'title':\
          \ title, 'sql': sql})\n    return {'result': result, 'count': len(result)}"
        code_language: python3
