server:
  port: ${DATAQUERY_SERVER_PORT:8089}

spring:
  application:
    name: huanbao-dataquery
  datasource:
    url: ${DATAQUERY_DB_URL:jdbc:kingbase8://localhost:54321/huanbao}
    username: ${DATAQUERY_DB_USERNAME:}
    password: ${DATAQUERY_DB_PASSWORD:}
    driver-class-name: ${DATAQUERY_DB_DRIVER:com.kingbase8.Driver}
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: huanbao-dataquery-hikari
      maximum-pool-size: ${DATAQUERY_DB_MAX_POOL_SIZE:8}
      minimum-idle: ${DATAQUERY_DB_MIN_IDLE:2}
      connection-timeout: ${DATAQUERY_DB_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${DATAQUERY_DB_VALIDATION_TIMEOUT_MS:1000}
      idle-timeout: ${DATAQUERY_DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DATAQUERY_DB_MAX_LIFETIME_MS:1800000}
      read-only: true
      auto-commit: false

vllm:
  base-url: ${VLLM_BASE_URL:http://121.237.178.23:9002/v1}
  model: ${VLLM_MODEL:Qwen3.8-27B}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
