version: "0.6.0"
kind: app
app:
  description: 统一识别制度问答、办公智能和流程办理意图，并为流程请求返回安全的结构化候选。
  icon: 🧭
  icon_background: '#E8F3FF'
  icon_type: emoji
  mode: workflow
  name: 环宝统一意图路由
  use_icon_as_answer_icon: false
dependencies: []
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      enabled: false
      number_limits: 0
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: start
          targetType: llm
        id: 1784704000001-source-1784704000002-target
        source: '1784704000001'
        sourceHandle: source
        target: '1784704000002'
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: llm
          targetType: code
        id: 1784704000002-source-1784704000003-target
        source: '1784704000002'
        sourceHandle: source
        target: '1784704000003'
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: code
          targetType: end
        id: 1784704000003-source-1784704000004-target
        source: '1784704000003'
        sourceHandle: source
        target: '1784704000004'
        targetHandle: target
        type: custom
        zIndex: 0
    nodes:
      - data:
          desc: 接收用户消息和可选的最近上下文。
          selected: false
          title: 开始
          type: start
          variables:
            - label: 用户消息
              max_length: 4000
              options: []
              required: true
              type: paragraph
              variable: query
            - label: 最近对话上下文
              max_length: 8000
              options: []
              required: false
              type: paragraph
              variable: recent_context
        height: 142
        id: '1784704000001'
        position:
          x: 80
          y: 260
        positionAbsolute:
          x: 80
          y: 260
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: 只判断意图和标准事项 ID，不生成任何业务系统标识。
          memory:
            enabled: false
            query_prompt_template: ''
            window:
              enabled: false
              size: 10
          model:
            completion_params:
              temperature: 0.1
            mode: chat
            name: qwen3.6-plus
            provider: langgenius/tongyi/tongyi
          prompt_template:
            - id: router-system
              role: system
              text: |-
                你是“环宝 AI 智能助手”的统一意图路由器。你只做分类和事项识别，不回答业务问题，不执行任何动作。

                只输出一个合法 JSON 对象，禁止输出 Markdown、代码围栏、思考过程或额外解释。格式必须是：
                {"route":"policy|office|workflow|unknown","workflow_id":"标准事项ID或unknown","confidence":0.0,"reason":"简短中文理由","fields":{}}

                路由规则：
                1. policy：公司制度、管理办法、费用标准、审批依据、规范、规定及制度条款查询。
                2. office：起草或改写通知、会议纪要、总结、报告、邮件、讲话稿、摘要、润色等内容生产。
                3. workflow：用户明确要求打开、发起、办理、查看 iGIX 表单、台账、菜单、看板或待办事项。
                4. unknown：信息不足、闲聊、能力范围外，或无法确定前三类。

                重要边界：办公写作内容即使出现“流程、表单、审批”等词，只要用户是在写材料而不是操作业务入口，就必须归为 office。流程意图不能仅靠关键词，必须包含打开、发起、办理、查看等动作诉求。

                workflow_id 只能从以下白名单选择：
                purchase_request, purchase_general_record_card, purchase_general_record_list,
                purchase_request_list, winning_bidder_approval, winning_bidder_approval_list,
                tech_upgrade_project_record_list, tech_upgrade_project_approval,
                maintenance_project_approval, maintenance_project_record_list,
                operation_maintenance_dashboard, technology_project_approval_list,
                leader_out_report, internship_reception_apply, information_disclosure_apply,
                motion_catalog_approval, unknown

                对应事项：
                - purchase_request：采购请示单
                - purchase_general_record_card：通用性备案表
                - purchase_general_record_list：通用性备案表台账
                - purchase_request_list：采购请示单台账
                - winning_bidder_approval：项目中标人确定报批表
                - winning_bidder_approval_list：项目中标人确定报批表台账
                - tech_upgrade_project_record_list：设备更新技改项目立项（备案）台账
                - tech_upgrade_project_approval：设备更新技改项目立项（备案）审批
                - maintenance_project_approval：检修项目立项（备案）审批
                - maintenance_project_record_list：检修项目立项（备案）台账
                - operation_maintenance_dashboard：运维系统看板
                - technology_project_approval_list：科技创新项目（备案）审批台账
                - leader_out_report：领导人员外出报备
                - internship_reception_apply：学生实习、公众接待申请
                - information_disclosure_apply：信息披露申请
                - motion_catalog_approval：议案汇总清单审批

                不允许输出 formCode、funcId、action、actionId，不允许自行创造事项 ID。当前 fields 固定输出空对象 {}，字段提取由受控代码处理。
            - id: router-user
              role: user
              text: |-
                用户消息：{{#1784704000001.query#}}

                最近上下文（可能为空）：{{#1784704000001.recent_context#}}
          selected: false
          structured_output:
            enabled: false
          title: 统一意图识别
          type: llm
          variables: []
          vision:
            enabled: false
        height: 98
        id: '1784704000002'
        position:
          x: 390
          y: 280
        positionAbsolute:
          x: 390
          y: 280
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          code: |-
            import json
            import re

            ROUTES = {"policy", "office", "workflow", "unknown"}

            REGISTRY = {
                "purchase_request": {"label": "打开采购请示单", "name": "采购请示单", "status": "verified", "action": "open_form", "formCode": "CGQSD", "funcId": "9744034a-7fcc-4510-97fa-f563aecd26e6"},
                "purchase_general_record_card": {"label": "打开通用性备案表", "name": "通用性备案表", "status": "pending", "action": "open_form", "formCode": "tyxbabCard", "funcId": "3d78001b-3077-4a30-92c6-3f7e1acfb0a1"},
                "purchase_general_record_list": {"label": "打开通用性备案表台账", "name": "通用性备案表台账", "status": "pending", "action": "open_menu", "formCode": "tyxbabList", "funcId": "39fda9a8-a44d-4c5c-ba36-0d4a5d7d15b9"},
                "purchase_request_list": {"label": "打开采购请示单台账", "name": "采购请示单台账", "status": "pending", "action": "open_menu", "formCode": "CgqsdBbList", "funcId": "e9eae7ff-792f-4413-adc0-4a888737b7b2"},
                "winning_bidder_approval": {"label": "打开项目中标人确定报批表", "name": "项目中标人确定报批表", "status": "pending", "action": "open_form", "formCode": "XmzbrqdbpbCard", "funcId": "4d469a6b-993b-4c70-8879-5c9e2e6c70fe"},
                "winning_bidder_approval_list": {"label": "打开项目中标人确定报批表台账", "name": "项目中标人确定报批表台账", "status": "pending", "action": "open_menu", "formCode": "XmzbrqdbpbList", "funcId": "96292cf7-5a5e-4a3b-b255-2f199f81e159"},
                "tech_upgrade_project_record_list": {"label": "打开设备更新技改项目立项（备案）台账", "name": "设备更新技改项目立项（备案）台账", "status": "pending", "action": "open_menu", "formCode": "jishugaizao", "funcId": "f1f86288-6812-459d-b9b5-6351e2f04150"},
                "tech_upgrade_project_approval": {"label": "打开设备更新技改项目立项（备案）审批", "name": "设备更新技改项目立项（备案）审批", "status": "pending", "action": "open_form", "formCode": "TechUpgradeProjectApproval", "funcId": "be5c44ce-8a34-4266-80d2-13cf9e086992"},
                "maintenance_project_approval": {"label": "打开检修项目立项（备案）审批", "name": "检修项目立项（备案）审批", "status": "pending", "action": "open_form", "formCode": "jxxmlxbaspbForm", "funcId": "8ed14722-111b-4d42-9ccb-5737341a89ec"},
                "maintenance_project_record_list": {"label": "打开检修项目立项（备案）台账", "name": "检修项目立项（备案）台账", "status": "pending", "action": "open_menu", "formCode": "jxxmlxbaspbList", "funcId": "1cf165d4-fd81-43ff-8051-4019e77ac049"},
                "operation_maintenance_dashboard": {"label": "打开运维系统看板", "name": "运维系统看板", "status": "pending", "action": "open_menu", "formCode": "zhbgkbdh", "funcId": "dd4424da-ed41-49c6-83f2-c758912a135a"},
                "technology_project_approval_list": {"label": "打开科技创新项目（备案）审批台账", "name": "科技创新项目（备案）审批台账", "status": "pending", "action": "open_menu", "formCode": "technologyPage", "funcId": "3ee222e9-cd14-40ac-96c1-51103b3e3624"},
                "leader_out_report": {"label": "打开领导人员外出报备", "name": "领导人员外出报备", "status": "pending", "action": "open_menu", "formCode": "ldrywcbblList", "funcId": "3f2c1a18-a190-45d4-9104-e8f30b6d275f"},
                "internship_reception_apply": {"label": "打开学生实习、公众接待申请", "name": "学生实习、公众接待申请", "status": "pending", "action": "open_menu", "formCode": "InshipVaList", "funcId": "13c7dd62-055a-4c7d-acd5-f3ff0b720e3e"},
                "information_disclosure_apply": {"label": "打开信息披露申请", "name": "信息披露申请", "status": "pending", "action": "open_form", "formCode": "DisclosePage", "funcId": "d0727c7f-9bfe-49db-858c-eef3034c6d7b"},
                "motion_catalog_approval": {"label": "议案汇总清单审批", "name": "议案汇总清单审批", "status": "unsupported"},
            }

            def _parse_json(text):
                raw = (text or "").strip()
                try:
                    return json.loads(raw)
                except Exception:
                    match = re.search(r"\{[\s\S]*\}", raw)
                    if not match:
                        return {}
                    try:
                        return json.loads(match.group(0))
                    except Exception:
                        return {}

            def main(model_output: str) -> dict:
                parsed = _parse_json(model_output)
                route = parsed.get("route") if parsed.get("route") in ROUTES else "unknown"
                workflow_id = str(parsed.get("workflow_id") or "unknown")
                reason = str(parsed.get("reason") or "未能稳定识别用户意图")[:200]
                try:
                    confidence = max(0.0, min(1.0, float(parsed.get("confidence", 0))))
                except Exception:
                    confidence = 0.0

                candidates = []
                reply = ""

                if route == "workflow":
                    item = REGISTRY.get(workflow_id)
                    if not item:
                        workflow_id = "unknown"
                        reply = "我识别到您想办理流程事项，请补充具体表单、台账或菜单名称。"
                    elif item["status"] == "verified":
                        candidates.append({
                            "id": workflow_id,
                            "label": item["label"],
                            "confidence": confidence,
                            "reason": reason,
                            "status": "verified",
                            "payload": {
                                "action": item["action"],
                                "formCode": item["formCode"],
                                "funcId": item["funcId"],
                            },
                        })
                        reply = "已识别流程事项，请确认后再执行打开操作。"
                    elif item["status"] == "pending":
                        candidates.append({
                            "id": workflow_id,
                            "label": item["label"],
                            "confidence": confidence,
                            "reason": reason,
                            "status": "pending",
                            "payload": None,
                        })
                        reply = "已识别“{}”，该事项仍待联调验证，暂不开放执行。".format(item["name"])
                    else:
                        candidates.append({
                            "id": workflow_id,
                            "label": item["label"],
                            "confidence": confidence,
                            "reason": reason,
                            "status": "unsupported",
                            "payload": None,
                        })
                        reply = "已识别“{}”，当前通信协议尚不支持直接打开该事项。".format(item["name"])
                elif route == "unknown":
                    reply = "我可以帮您查询公司制度、起草办公材料，或定位并打开业务流程。请补充您的具体需求。"

                return {
                    "route": route,
                    "workflow_id": workflow_id,
                    "confidence": confidence,
                    "reason": reason,
                    "reply": reply,
                    "candidates_json": json.dumps(candidates, ensure_ascii=False),
                }
          code_language: python3
          desc: 校验模型结果，并从固定白名单生成安全候选；禁止模型直接生成业务标识。
          outputs:
            candidates_json:
              children: null
              type: string
            confidence:
              children: null
              type: number
            reason:
              children: null
              type: string
            reply:
              children: null
              type: string
            route:
              children: null
              type: string
            workflow_id:
              children: null
              type: string
          selected: false
          title: 白名单校验与候选生成
          type: code
          variables:
            - value_selector:
                - '1784704000002'
                - text
              value_type: string
              variable: model_output
        height: 98
        id: '1784704000003'
        position:
          x: 700
          y: 280
        positionAbsolute:
          x: 700
          y: 280
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          desc: 返回路由结果和可选流程候选，由前端决定下一步。
          outputs:
            - value_selector:
                - '1784704000003'
                - route
              value_type: string
              variable: route
            - value_selector:
                - '1784704000003'
                - workflow_id
              value_type: string
              variable: workflow_id
            - value_selector:
                - '1784704000003'
                - confidence
              value_type: number
              variable: confidence
            - value_selector:
                - '1784704000003'
                - reason
              value_type: string
              variable: reason
            - value_selector:
                - '1784704000003'
                - reply
              value_type: string
              variable: reply
            - value_selector:
                - '1784704000003'
                - candidates_json
              value_type: string
              variable: candidates_json
          selected: false
          title: 结束
          type: end
        height: 210
        id: '1784704000004'
        position:
          x: 1010
          y: 225
        positionAbsolute:
          x: 1010
          y: 225
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.85
